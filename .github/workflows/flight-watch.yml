name: Flight watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Restore watcher state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: flight-watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flight-watch-state-

      - name: Search flights
        id: search
        run: npm run watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: flight-watch-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flight-watch-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
